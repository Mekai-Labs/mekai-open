<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Mekai Open target system architecture</title>
  <desc id="desc">Three automation input families flow through a local data and context layer and a versioned function runtime into KPI, observability, replay, and custom function outputs. Availability labels distinguish the current core, planned packs, and the private Mekai Lab preview.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0D0D0D"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C2410C"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0D0D0D; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B6B6B; }
      .section { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; fill: #C2410C; }
      .heading { font: 700 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0D0D0D; }
      .body { font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B6B6B; }
      .body-dark { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0D0D0D; }
      .tag-dark { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; fill: #FAFAFA; }
      .tag-orange { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; fill: #C2410C; }
      .tag-white { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="1180" fill="#FAFAFA"/>

  <text x="40" y="54" class="title">Mekai Open — target system architecture</text>
  <text x="40" y="86" class="subtitle">A local, read-only data and function layer for deployed automation</text>

  <g aria-label="Availability legend">
    <rect x="40" y="112" width="208" height="40" fill="#0D0D0D"/>
    <text x="144" y="139" text-anchor="middle" class="tag-dark">AVAILABLE CORE</text>
    <rect x="264" y="112" width="190" height="40" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
    <text x="359" y="139" text-anchor="middle" class="tag-orange">PLANNED PACK</text>
    <rect x="470" y="112" width="218" height="40" fill="#C2410C"/>
    <text x="579" y="139" text-anchor="middle" class="tag-white">PRIVATE PREVIEW</text>
  </g>

  <text x="40" y="190" class="section">01 — INPUTS</text>

  <g aria-label="Automation assets — planned adapters">
    <rect x="40" y="210" width="350" height="196" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="40" y="210" width="8" height="196" fill="#C2410C"/>
    <text x="68" y="250" class="heading">Automation assets</text>
    <text x="68" y="286" class="body">
      <tspan x="68" dy="0">Robots, AMRs / AGVs, arms and cells</tspan>
      <tspan x="68" dy="30">Doors, lifts, conveyors, chargers</tspan>
      <tspan x="68" dy="30">and interlocks</tspan>
    </text>
    <text x="68" y="382" class="tag-orange">PLANNED ADAPTERS</text>
  </g>

  <g aria-label="Protocols and files — mixed availability">
    <rect x="425" y="210" width="350" height="196" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="425" y="210" width="8" height="196" fill="#0D0D0D"/>
    <text x="453" y="250" class="heading">Protocols + files</text>
    <text x="453" y="286" class="body-dark">
      <tspan x="453" dy="0">Available: VDA 5050 3.0</tspan>
      <tspan x="453" dy="30">Mekai Capture JSONL</tspan>
    </text>
    <text x="453" y="354" class="body">Planned: MQTT • ROS 2 / MCAP</text>
  </g>

  <g aria-label="Site and business systems — planned adapters">
    <rect x="810" y="210" width="350" height="196" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <rect x="810" y="210" width="8" height="196" fill="#C2410C"/>
    <text x="838" y="250" class="heading">Site + business systems</text>
    <text x="838" y="286" class="body">
      <tspan x="838" dy="0">WCS / WES / WMS / FMS, MES and ERP</tspan>
      <tspan x="838" dy="30">PLCs, SCADA, HMI and historians</tspan>
    </text>
    <text x="838" y="382" class="tag-orange">PLANNED ADAPTERS</text>
  </g>

  <line x1="215" y1="406" x2="215" y2="455" stroke="#0D0D0D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="406" x2="600" y2="455" stroke="#0D0D0D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="985" y1="406" x2="985" y2="455" stroke="#0D0D0D" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="492" class="section">02 — NORMALIZE CONTEXT</text>
  <g aria-label="Local data and context layer — available core">
    <rect x="40" y="512" width="1120" height="138" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="2"/>
    <rect x="40" y="512" width="10" height="138" fill="#0D0D0D"/>
    <text x="72" y="554" class="heading">Local data + context layer</text>
    <text x="72" y="590" class="body-dark">Exact payload • source identity • time • sessions • provenance</text>
    <text x="72" y="622" class="body">Coverage • drops • gaps • missingness • clock diagnostics</text>
    <rect x="918" y="536" width="214" height="40" fill="#0D0D0D"/>
    <text x="1025" y="563" text-anchor="middle" class="tag-dark">AVAILABLE CORE</text>
  </g>

  <line x1="600" y1="650" x2="600" y2="699" stroke="#0D0D0D" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="736" class="section">03 — CREATE REPEATABLE FUNCTIONS</text>
  <g aria-label="Versioned function runtime — core runtime available, authoring planned">
    <rect x="40" y="756" width="1120" height="142" fill="#0D0D0D"/>
    <text x="72" y="800" class="heading" fill="#FFFFFF" style="fill:#FFFFFF">Versioned function runtime</text>
    <text x="72" y="837" class="body" fill="#FAFAFA" style="fill:#FAFAFA">Deterministic built-ins turn normalized observations into declared, repeatable functions.</text>
    <text x="72" y="869" class="body" fill="#FAFAFA" style="fill:#FAFAFA">Custom authoring and sandboxing are planned; AI may propose, but never decides.</text>
    <rect x="918" y="778" width="214" height="40" fill="#FAFAFA"/>
    <text x="1025" y="805" text-anchor="middle" class="tag-orange">CORE AVAILABLE</text>
  </g>

  <line x1="600" y1="898" x2="600" y2="946" stroke="#0D0D0D" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="980" class="section">04 — OUTPUTS</text>

  <g aria-label="KPI and exception outputs — available core">
    <rect x="40" y="1000" width="268" height="128" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="2"/>
    <text x="60" y="1036" class="heading">KPIs + exceptions</text>
    <text x="60" y="1068" class="body">13 built-in functions</text>
    <text x="60" y="1098" class="tag-dark" fill="#0D0D0D" style="fill:#0D0D0D">AVAILABLE CORE</text>
  </g>

  <g aria-label="Observability and alarms — planned pack">
    <rect x="324" y="1000" width="268" height="128" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="344" y="1036" class="heading">Observe + alert</text>
    <text x="344" y="1068" class="body">Fleet views, alarms, routing</text>
    <text x="344" y="1098" class="tag-orange">PLANNED PACK</text>
  </g>

  <g aria-label="Replay and interface verification — planned pack">
    <rect x="608" y="1000" width="268" height="128" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="628" y="1036" class="heading">Replay + verify</text>
    <text x="628" y="1068" class="body">Incidents and interfaces</text>
    <text x="628" y="1098" class="tag-orange">PLANNED PACK</text>
  </g>

  <g aria-label="Trends and custom functions — planned pack">
    <rect x="892" y="1000" width="268" height="128" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
    <text x="912" y="1036" class="heading">Trend + customize</text>
    <text x="912" y="1068" class="body">Trends and sandboxed functions</text>
    <text x="912" y="1098" class="tag-orange">PLANNED PACK</text>
  </g>

  <g aria-label="Mekai Lab private preview">
    <line x1="600" y1="1128" x2="600" y2="1142" stroke="#C2410C" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
    <rect x="40" y="1140" width="1120" height="34" fill="#C2410C"/>
    <text x="600" y="1164" text-anchor="middle" class="tag-white">MEKAI LAB — SYNTHETIC PRIVATE PREVIEW</text>
  </g>
</svg>
